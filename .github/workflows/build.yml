name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact-name: ImageStudio-macOS
            artifact-glob: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            platform: win
            artifact-name: ImageStudio-Windows
            artifact-glob: |
              dist/*.exe
              dist/*.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx electron-vite build

      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ImageStudio-macOS
          path: artifacts/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ImageStudio-Windows
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | **Windows** | `.exe` installer or `.zip` portable |
            | **macOS** | `.dmg` disk image or `.zip` |

            ### macOS note
            The app is unsigned. Before opening it for the first time, run:
            ```bash
            xattr -r -d com.apple.quarantine /Applications/ImageStudio.app
            ```

            ### Windows note
            Windows SmartScreen may show a warning on first launch. Click **"More info"** → **"Run anyway"**.
